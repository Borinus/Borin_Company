name = "borin-orcamento"
main = "index.js"
compatibility_date = "2026-07-01"

# Roda no proprio dominio, em /api/*. Como e a mesma origem do site, nao ha
# CORS envolvido — a rota do Worker tem precedencia sobre o Pages.
[[routes]]
pattern = "borinprojetos.com.br/api/*"
zone_name = "borinprojetos.com.br"

# O www tambem, desde 05/08/2026. Sem isto, www.borinprojetos.com.br/api/zap
# caia no site estatico e devolvia a pagina 404 em HTML — com status 404 e 111 KB
# de corpo. Quem cola o endereco com www num campo de webhook nao ve "rota
# errada": ve "nao consegui validar", e vai procurar defeito na autenticacao.
[[routes]]
pattern = "www.borinprojetos.com.br/api/*"
zone_name = "borinprojetos.com.br"

# Binding nativo de email. Nao precisa de conta nem chave de terceiro.
# destination_address TEM que estar verificado em:
#   Cloudflare > borinprojetos.com.br > Email > Email Routing > Destination addresses
[[send_email]]
name = "EMAIL"
destination_address = "mateusborin73@gmail.com"

[vars]
# de onde o email sai — precisa ser do dominio que esta na sua conta
REMETENTE = "site@borinprojetos.com.br"
# pra onde chega — o mesmo endereco verificado do binding acima
DESTINO = "mateusborin73@gmail.com"

# Modelo de WhatsApp do aviso de pedido. O de botoes foi aprovado em 05/08/2026:
# "Acompanhar o pedido" abre /conta e "Falar com o Mateus" liga pro numero DE
# VERDADE — resolve o cliente responder no numero automatico (que nao recebe).
ZAP_TEMPLATE = "pedido_recebido_botoes"

# Entrar com o Google. O client_id NAO e segredo — ele vai dentro do HTML de
# qualquer site que use login do Google, e a seguranca vem da conferencia da
# assinatura do token no google.js, nao de esconder isto. Por isso fica em
# [vars] (versionado), nao em secret. Criado em 08/08/2026, projeto "Borin
# Site", app publicado em producao (qualquer conta Google entra).
GOOGLE_CLIENT_ID = "65339244748-lgt3gvfqip747m5b6pdhmuvel9s28jgt.apps.googleusercontent.com"

# Entrar com a Microsoft. Mesmo racional do Google: o Application (client) ID
# não é segredo — vai na URL de login. A segurança vem da conferência da
# assinatura do id_token no microsoft.js. Preencher com o ID do app registrado
# em portal.azure.com (Entra ID > App registrations). Vazio = botão não aparece.
# App "Borin Projetos Elétricos" registrado no Entra ID em 09/08/2026, contas
# multilocatário + pessoais, redirect https://borinprojetos.com.br/entrar,
# ID tokens habilitado (fluxo implícito). Não é segredo — vai na URL de login.
MICROSOFT_CLIENT_ID = "6eedbd6d-a79b-4e19-be6c-45edbfbfde22"

# Conta do cliente. KV e nao banco: sao poucos registros, nenhuma consulta por
# campo, e nao ha esquema pra migrar.
[[kv_namespaces]]
binding = "CLIENTES"
id = "ab20d3b8f3f54eab877d316a02fe88f6"

# Os arquivos do projeto. R2 e nao KV: KV tem limite de 25 MB por valor e nao
# e feito pra binario. Nunca publico — o download passa pelo Worker, que
# confere a sessao e a empresa antes de devolver o byte.
[[r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "borin-projetos"
