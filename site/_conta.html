<style>
/* FONTES */
/* BASE-FORM */

.projeto { border: 1px solid var(--rule); margin-bottom: 0.9rem; }
.projeto__topo {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 0.6rem 1rem; flex-wrap: wrap;
  padding: 0.85rem 1rem; border-bottom: 1px solid var(--rule);
}
.projeto__nome { font-weight: 600; font-size: var(--fs-body); }
.projeto__cod { font-family: var(--mono); font-size: var(--fs-micro); color: var(--ink-micro); }

/* a trilha de etapas: a atual em Comando, as passadas cheias, as futuras vazias */
.trilha { display: flex; flex-wrap: wrap; gap: 1px; background: var(--rule); }
.trilha div {
  background: var(--ground); flex: 1 1 6rem; padding: 0.5rem 0.6rem;
  font-family: var(--mono); font-size: var(--fs-micro); color: var(--ink-micro);
  display: flex; align-items: center; gap: 0.4rem;
}
.trilha .no { width: 0.45rem; height: 0.45rem; background: var(--rule); flex: none; }
.trilha .passou .no { background: var(--ink); }
.trilha .passou { color: var(--ink-soft); }
.trilha .agora { color: var(--acento); }
.trilha .agora .no { background: var(--acento); }

.projeto__pe { padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; gap: 0.6rem 1.4rem; align-items: center; }
.dado-linha { display: flex; flex-direction: column; gap: 0.1rem; }
.dado-linha b { font-family: var(--mono); font-size: var(--fs-micro); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-micro); font-weight: 400; }
.dado-linha span { font-size: var(--fs-small); }
.projeto__nota { padding: 0 1rem 0.85rem; font-size: var(--fs-small); color: var(--ink-soft); }

.vazio { border: 1px solid var(--rule); padding: 1.2rem; font-size: var(--fs-small); color: var(--ink-soft); }
.oculto { display: none; }
</style>

<script>
/* BASE-JS */

function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function dataCurtaISO(iso) {
  try {
    var d = new Date(iso), z = function (n) { return (n < 10 ? '0' : '') + n; };
    return z(d.getDate()) + '/' + z(d.getMonth() + 1);
  } catch (e) { return ''; }
}

/* A trilha mostra onde o projeto esta sem o cliente precisar perguntar.
   E a resposta pro "e o meu projeto?" que hoje chega por WhatsApp. */
function trilha(etapas, atual) {
  var i = etapas.indexOf(atual);
  return '<div class="trilha">' + etapas.map(function (e, n) {
    var cls = n < i ? 'passou' : (n === i ? 'agora' : '');
    return '<div class="' + cls + '"><span class="no"></span>' + esc(e) + '</div>';
  }).join('') + '</div>';
}

function cartao(p, etapas) {
  var h = '<div class="projeto">';
  h += '<div class="projeto__topo">'
     + '<span class="projeto__nome">' + esc(p.nome || 'Projeto ' + p.codigo) + '</span>'
     + '<span class="projeto__cod">#' + esc(p.codigo) + '</span></div>';
  h += trilha(etapas, p.status);

  var pe = '';
  if (p.prazo) {
    pe += '<div class="dado-linha"><b>Entrega prevista</b><span>' + esc(p.prazo) + '</span></div>';
  }
  if (p.atualizado_em) {
    pe += '<div class="dado-linha"><b>Atualizado</b><span>' + dataCurtaISO(p.atualizado_em) + '</span></div>';
  }
  if (p.link) {
    pe += '<a class="botao" href="' + esc(p.link) + '" target="_blank" rel="noopener">Baixar a entrega</a>';
  }
  if (pe) { h += '<div class="projeto__pe">' + pe + '</div>'; }
  if (p.nota) { h += '<p class="projeto__nota">' + esc(p.nota) + '</p>'; }

  return h + '</div>';
}

function montar(d) {
  var corpo = document.getElementById('corpo');
  document.getElementById('titulo').textContent =
    d.contato ? d.contato.split(' ')[0] + ', seus projetos' : 'Seus projetos';
  document.getElementById('subtitulo').textContent =
    (d.empresa ? d.empresa + ' · ' : '') + d.email;
  document.getElementById('acoes').style.display = 'flex';

  if (!d.projetos.length) {
    corpo.innerHTML = '<div class="vazio">Nenhum projeto em andamento ainda. '
      + 'Assim que o contrato for assinado, ele aparece aqui com o andamento.'
      + (d.fichas.length ? ' Suas fichas preenchidas continuam salvas.' : '')
      + '</div>';
    return;
  }
  corpo.innerHTML = d.projetos.map(function (p) { return cartao(p, d.etapas); }).join('');
}

document.getElementById('btSair').addEventListener('click', function () {
  api('sair', {}).then(function () { location.href = '/entrar'; });
});

fetch('/api/acesso/projetos', { credentials: 'same-origin' })
  .then(function (r) { return r.json(); })
  .then(function (d) {
    if (!d.entrou) { location.href = '/entrar?ir=/conta'; return; }
    montar(d);
  })
  .catch(function () {
    document.getElementById('titulo').textContent = 'Não consegui carregar.';
    document.getElementById('subtitulo').textContent = 'Verifique a conexão e recarregue a página.';
  });
</script>
